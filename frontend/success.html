<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Successful</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0a0a0f;
      color: white;
      font-family: Arial, sans-serif;
    }

    .card {
      background: #16161f;
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      max-width: 500px;
      border: 1px solid rgba(124,111,255,0.2);
    }

    h1 {
      color: #7c6fff;
      margin-bottom: 12px;
    }

    p {
      color: #aaa;
      margin-bottom: 24px;
    }

    a {
      display: inline-block;
      background: #7c6fff;
      color: white;
      text-decoration: none;
      padding: 14px 24px;
      border-radius: 12px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Payment Successful 🎉</h1>
    <p id="plan-text"></p>
    <a id="download-link" target="_blank">Open Your Product</a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const plan = params.get('plan');

    const text = document.getElementById('plan-text');
    const link = document.getElementById('download-link');

    if (plan === 'basic') {
      text.innerText = 'You purchased the Basic Plan';
      link.href = './basic-demo.txt';;
    } else if (plan === 'standard') {
      text.innerText = 'You purchased the Standard Plan';
      link.href = './standard-demo.txt';;
    } else {
      text.innerText = 'You purchased the Premium Plan';
      link.href = './premium-demo.txt';;
    }
  </script>
</body>
</html>
